services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wholesale_ops
      POSTGRES_USER: wholesale_ops
      POSTGRES_PASSWORD: wholesale_ops
    ports:
      - "54329:5432"
    volumes:
      - wholesale_ops_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale_ops -d wholesale_ops"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  wholesale_ops_postgres:
